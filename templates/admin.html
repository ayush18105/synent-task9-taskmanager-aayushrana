<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

<h1>Admin Dashboard</h1>

<div class="card">
<h3>Total Users</h3>
<h2>{{ total_users }}</h2>
</div>

<div class="card">
<h3>Total Tasks</h3>
<h2>{{ total_tasks }}</h2>
</div>

<div class="card">
<h3>Completed Tasks</h3>
<h2>{{ completed }}</h2>
</div>

<div class="card">
<h3>Pending Tasks</h3>
<h2>{{ pending }}</h2>
</div>

<br>

<a href="/dashboard">Back Dashboard</a>

</div>

</body>
</html>
